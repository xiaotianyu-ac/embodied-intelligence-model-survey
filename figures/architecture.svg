<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500">
<title>Roles and feedback in an embodied intelligence system</title>
<desc>Analytical reference architecture. A semantic planner proposes goals, an action policy proposes executable motion, and a motor controller operates the body. Observations close the feedback loop. Actual update rates and interfaces are model-specific.</desc>
<rect x="1" y="1" width="838" height="498" fill="white" stroke="#dddddd"/>
<text x="40" y="40" font-size="23" font-weight="bold" fill="#161616">From goals to physical feedback</text>
<rect x="40" y="75" width="555" height="75" fill="#eceff1" stroke="#555555"/>
<text x="60" y="106" font-size="20" font-weight="bold">Goal and reasoning layer</text>
<text x="60" y="132" font-size="17">Language, memory, subgoals, constraints</text>
<line x1="317" y1="150" x2="317" y2="183" stroke="#333333" stroke-width="2"/>
<polygon points="311,176 317,185 323,176" fill="#333333"/>
<rect x="40" y="186" width="555" height="75" fill="#f5f5f5" stroke="#555555"/>
<text x="60" y="217" font-size="20" font-weight="bold">Action policy and motion interface</text>
<text x="60" y="243" font-size="17">Action chunks, waypoints, poses or motor targets</text>
<line x1="317" y1="261" x2="317" y2="294" stroke="#333333" stroke-width="2"/>
<polygon points="311,287 317,296 323,287" fill="#333333"/>
<rect x="40" y="297" width="555" height="75" fill="#eceff1" stroke="#555555"/>
<text x="60" y="328" font-size="20" font-weight="bold">Body controller and physical world</text>
<text x="60" y="354" font-size="17">Balance, contact, actuation and environment response</text>
<line x1="595" y1="334" x2="765" y2="334" stroke="#315b7c" stroke-width="2"/>
<line x1="765" y1="334" x2="765" y2="113" stroke="#315b7c" stroke-width="2"/>
<line x1="765" y1="113" x2="605" y2="113" stroke="#315b7c" stroke-width="2"/>
<polygon points="613,107 603,113 613,119" fill="#315b7c"/>
<line x1="765" y1="223" x2="605" y2="223" stroke="#315b7c" stroke-width="2"/>
<polygon points="613,217 603,223 613,229" fill="#315b7c"/>
<text x="630" y="164" font-size="17" fill="#315b7c">Vision / touch</text>
<text x="630" y="188" font-size="17" fill="#315b7c">Proprioception</text>
<text x="630" y="275" font-size="17" fill="#315b7c">Fresh feedback</text>
<text x="40" y="416" font-size="17" font-weight="bold">The interface is part of the model system</text>
<text x="40" y="445" font-size="16">Specify frame, rate, action horizon, expiry and control authority.</text>
<text x="40" y="473" font-size="16" fill="#555555">Analytical role decomposition; layers may be jointly trained or implemented separately.</text>
</svg>
