<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580">
<title>Selected relationships between embodied model families</title>
<desc>Solid arrows indicate a documented method extension, version progression or encoder reuse. Blue arrows indicate documented system composition. Dashed connectors indicate analytical similarity, not code or weight inheritance.</desc>
<rect x="1" y="1" width="838" height="578" fill="white" stroke="#dddddd"/>
<text x="35" y="40" font-size="23" font-weight="bold">Model relationships: lineage and composition</text>
<text x="35" y="70" font-size="16" fill="#555555">A family progression does not imply shared weights.</text>
<rect x="35" y="100" width="195" height="58" fill="#eceff1" stroke="#555555"/>
<text x="132" y="125" font-size="18" text-anchor="middle" font-weight="bold">AMP</text>
<text x="132" y="147" font-size="15" text-anchor="middle">Motion distribution</text>
<rect x="322" y="100" width="195" height="58" fill="#eceff1" stroke="#555555"/>
<text x="419" y="125" font-size="18" text-anchor="middle" font-weight="bold">ASE</text>
<text x="419" y="147" font-size="15" text-anchor="middle">Reusable latent skills</text>
<line x1="230" y1="128" x2="312" y2="128" stroke="#333333" stroke-width="2"/>
<polygon points="305,122 315,128 305,134" fill="#333333"/>
<text x="603" y="134" font-size="16">Method extension</text>
<rect x="35" y="188" width="195" height="48" fill="#f5f5f5" stroke="#555555"/>
<text x="132" y="219" font-size="18" text-anchor="middle" font-weight="bold">H2O</text>
<rect x="322" y="188" width="195" height="48" fill="#f5f5f5" stroke="#555555"/>
<text x="419" y="219" font-size="18" text-anchor="middle" font-weight="bold">OmniH2O</text>
<line x1="230" y1="212" x2="312" y2="212" stroke="#333333" stroke-width="2"/>
<polygon points="305,206 315,212 305,218" fill="#333333"/>
<text x="603" y="218" font-size="16">Documented follow-up</text>
<rect x="35" y="266" width="195" height="48" fill="#eceff1" stroke="#555555"/>
<text x="132" y="297" font-size="18" text-anchor="middle" font-weight="bold">ViNT</text>
<rect x="322" y="266" width="195" height="48" fill="#eceff1" stroke="#555555"/>
<text x="419" y="297" font-size="18" text-anchor="middle" font-weight="bold">NoMaD</text>
<line x1="230" y1="290" x2="312" y2="290" stroke="#333333" stroke-width="2"/>
<polygon points="305,284 315,290 305,296" fill="#333333"/>
<text x="603" y="296" font-size="16">Encoder reuse</text>
<rect x="35" y="344" width="195" height="48" fill="#f5f5f5" stroke="#555555"/>
<text x="132" y="375" font-size="18" text-anchor="middle" font-weight="bold">Helix</text>
<rect x="322" y="344" width="195" height="48" fill="#f5f5f5" stroke="#555555"/>
<text x="419" y="375" font-size="18" text-anchor="middle" font-weight="bold">Helix 02</text>
<line x1="230" y1="368" x2="312" y2="368" stroke="#333333" stroke-width="2"/>
<polygon points="305,362 315,368 305,374" fill="#333333"/>
<text x="603" y="374" font-size="16">Version extension</text>
<rect x="35" y="422" width="195" height="48" fill="#edf3f6" stroke="#315b7c"/>
<text x="132" y="453" font-size="18" text-anchor="middle" font-weight="bold">GR00T policy</text>
<rect x="322" y="422" width="195" height="48" fill="#edf3f6" stroke="#315b7c"/>
<text x="419" y="453" font-size="18" text-anchor="middle" font-weight="bold">SONIC controller</text>
<line x1="230" y1="446" x2="312" y2="446" stroke="#315b7c" stroke-width="2"/>
<polygon points="305,440 315,446 305,452" fill="#315b7c"/>
<text x="603" y="452" font-size="16" fill="#315b7c">System composition</text>
<polyline points="517,368 552,368 552,446 517,446" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="35" y="517" font-size="16">Solid: documented relationship. Blue: linked execution components.</text>
<text x="35" y="545" font-size="16" fill="#555555">Dashed: hierarchical-control analogy between Helix 02 and SONIC, not ancestry.</text>
</svg>
